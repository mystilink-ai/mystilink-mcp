[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mystilink-mcp"
version = "0.1.1"
description = "Local Mystilink MCP integration over calculator CLIs (stdio + optional 127.0.0.1 FastAPI)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Mystilink" }]
keywords = ["mystilink", "mcp", "bazi", "ziwei", "horoscope", "tarot", "liuyao"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Utilities",
]
dependencies = [
  "mcp>=1.2.0",
]

[project.optional-dependencies]
local-api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
dev = ["pytest>=7", "fastapi>=0.110", "uvicorn[standard]>=0.27", "httpx>=0.27"]

[project.scripts]
mystilink-mcp = "mystilink_mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["mystilink_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
